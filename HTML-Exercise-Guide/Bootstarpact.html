<!DOCTYPE html>
<html>
  <head>
    <title> LOGIN FORM </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

    <h1 class="text-center my-4"> FFBB </h1>

    <img src="photo.jpg" alt="Photo" class="photo">

    <div class="login-box container col-md-4">
      <form>

        <h2 class="text-center mb-4"> Login Here </h2>

        <div class="mb-3">
          <label for="username" class="form-label"> Username: </label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"> Password: </label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary w-100"> Login </button>
      </form>
    </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header text-center">
                        <h3>
                            Create Account <br> A copy from system code
                        </h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea name="address" class="form-control" rows="2" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contact Number</label>
                                <input name="contact" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>

                        <hr>
                        <p class="text-center">
                            Already have an account? 
                            <a href="login.php">Login here</a>.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </body>
</html>
